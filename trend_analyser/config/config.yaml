# ============================================================
# Trend Analyser — Configuration
# Products: Purple Pi OH2, Flamingo Edge Controller
# ============================================================

analysis:
  recency_days: 7
  top_trending: 20
  min_velocity: 10
  min_seasonality: 0.15

ai:
  enabled: true
  model: "llama3-70b-8192"
  modules:
    - market_summary
    - content_ideas
    - keyword_explanations

output:
  format: "both"
  output_dir: "output"

# Source weights
source_weights:
  trends: 3.0
  rss:    2.0
  tavily: 1.5
  reddit: 1.0