# ── Feature matrix — which features to compare ───────────────
comparison_features:
  - "NVMe support"
  - "RAM capacity (max)"
  - "USB 3.0"
  - "HDMI output"
  - "Wi-Fi"
  - "Bluetooth"
  - "GPIO pins"
  - "PCIe"
  - "NPU / AI accelerator"
  - "4K video output"
  - "dual Ethernet"
  - "eMMC"

# ── Keywords that signal a strength ──────────────────────────
strength_signals:
  - "up to 16gb"
  - "up to 32gb"
  - "nvme"
  - "pcie"
  - "npu"
  - "ai accelerator"
  - "wi-fi 6"
  - "hdmi 2.1"
  - "usb 3.0"
  - "dual ethernet"
  - "rk3588"
  - "active cooling"

# ── Keywords that signal a weakness ──────────────────────────
weakness_signals:
  - "no nvme"
  - "no wifi"
  - "limited ram"
  - "no hdmi"
  - "micro hdmi"
  - "usb 2.0 only"
  - "no gpio"
  - "no pcie"
  - "single core"
  - "armv7"

# ── Price tier thresholds (USD) ──────────────────────────────
pricing:
  low_max: 35
  mid_max: 75
  high_min: 76

# ── Analysis settings ─────────────────────────────────────────
settings:
  # Max RSS articles to read from RSS_Feeder/db/news.db per run
  # The DB already contains only scored, deduplicated articles
  rss_max_articles: 200

  # How many days back to look in the RSS DB
  rss_lookback_days: 30

  # How many Vector DB results to pull per competitor query
  # (reads from vector_db/db/ at project root)
  vector_top_k: 5

  # Minimum cosine similarity score for a vector result to be used (0-1)
  vector_min_score: 0.3

  # Skip Groq AI step even if key is set
  skip_ai: false

  # Output directory (relative to competitor_analysis/)
  output_dir: "output"