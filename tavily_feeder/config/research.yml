# ============================================================
# Tavily Research Feeder — Configuration
# Products: Purple Pi OH2 (SBC), Flamingo (Edge Controller)
# Market: Global SBCs + Home Automation devices (Sri Lanka + Global)
# ============================================================

my_products:
  - Purple Pi OH2
  - Flamingo Edge Controller
  - Moes Smart Devices

competitors:
  # ── Global SBC Competitors ────────────────────────────────
  - Raspberry Pi 5
  - Orange Pi 5 Pro
  - Radxa Rock 5B

  # ── Global HA Device Competitors ─────────────────────────
  - Sonoff
  - Shelly
  - Aqara
  - Tuya Smart
  - Tasmota devices

  # ── Sri Lanka Local Competitors ───────────────────────────
  - Dialog Smart Home
  - Clevr Smart Home
  - Shinrai Smart Home
  - SmartDream Home Lanka

# Blog / news sites to extract content from
spy_sites:
  - https://www.home-assistant.io/blog/
  - https://www.hackster.io/home-automation
  - https://www.cnx-software.com/
  - https://www.dialog.lk/shop/smart-home
  - https://clevr.lk/
  - https://shinrai-smarthome.lk/
  - https://www.smartdreamhomelanka.com/
  - https://www.moes.life/
  - https://linuxgizmos.com/

# Questions for your own products
questions:
  - "latest news about {product} 2026"
  - "what are users saying about {product}"
  - "{product} vs competitors"
  - "{product} home assistant compatible"
  - "{product} zigbee matter support"

# Questions for competitors
competitor_questions:
  - "{product} pricing and features 2026"
  - "{product} home assistant integration"
  - "{product} smart home review"
  - "{product} zigbee gateway review"
  - "{product} vs alternatives"

settings:
  extract_spy_sites: true
  use_research_api: false
  max_results: 5
  output_dir: results