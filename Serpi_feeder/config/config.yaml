# ============================================================
# Serpi Feeder — Google Trends Configuration
# Products: Purple Pi OH2 (SBC), Flamingo (Edge Controller)
# Market: Global SBCs, Edge Controllers, Home Automation
# ============================================================

settings:
  geo: "US"                  # Global baseline — US gives most reliable trend data
  time_range: "today 12-m"   # today 3-m | today 12-m | today 5-y | now 7-d
  data_dir: "data"
  monthly_credit_limit: 250
  rate_limit_delay: 2.0
  force_refresh: false

profiles:
  quick:
    layers_to_run: ["core"]
    batch_size: 5

  standard:
    layers_to_run: ["core", "extended"]
    batch_size: 5

  full:
    layers_to_run: ["core", "extended", "deep"]
    batch_size: 5
    fetch_related_queries: true
    fetch_related_topics: true

# ============================================================
# MARKETS
# ============================================================

markets:

  sbc:
    label: "Single Board Computers"
    geo: "US"
    layers:
      core:
        - "raspberry pi"
