# ============================================================
# Sentiment word lists
# ============================================================
sentiment:
  positive_words:
    - "working"
    - "works"
    - "love"
    - "great"
    - "awesome"
    - "excellent"
    - "perfect"
    - "amazing"
    - "success"
    - "solved"
    - "fixed"
    - "happy"
    - "thanks"
    - "finally"
    - "impressed"
    - "recommend"
    - "good"
    - "stable"
    - "fast"
    - "easy"
    - "reliable"
    - "paired"
    - "connected"

  negative_words:
    - "issue"
    - "problem"
    - "fail"
    - "error"
    - "broken"
    - "crash"
    - "stuck"
    - "frustrated"
    - "annoying"
    - "terrible"
    - "bad"
    - "worst"
    - "disappointing"
    - "useless"
    - "slow"
    - "unreliable"
    - "not working"
    - "hate"
    - "never"
    - "offline"
    - "unavailable"
    - "dropped"

# ============================================================
# Scoring
# ============================================================
scoring:
  weight_upvotes:  1.0
  weight_comments: 0.5
  recency_bonus_days: 7

# ============================================================
# Output
# ============================================================
output:
  output_dir: "output"
  save_json: true