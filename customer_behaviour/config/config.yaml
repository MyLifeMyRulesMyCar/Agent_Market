# ============================================================
# Customer Behaviour Agent — Configuration
# Products: Purple Pi OH2, Flamingo Edge Controller
# HA Partner: Moes
# ============================================================

subreddits:
  - homeassistant
  - homeautomation
  - homelab
  - SingleBoardComputer
  - raspberry_pi
  - OrangePi
  - IOT
  - MQTT
  - nodered
  - Lora
  - LoRaWAN
  - MatterProtocol
  - ZigBee
  - esp32
  - PINE64

# ============================================================
# Pain Point Detection
# ============================================================
pain_triggers:
  - "issue"
  - "problem"
  - "fail"
  - "failed"
  - "failure"
  - "not working"
  - "doesn't work"
  - "error"
  - "cannot"
  - "can't"
  - "won't boot"
  - "crash"
  - "crashing"
  - "broken"
  - "help"
  - "stuck"
  - "frustrating"
  - "annoying"
  - "bug"
  - "slow"
  - "unstable"
  - "freezing"
  - "lockup"
  - "corrupt"
  - "no signal"
  - "not detected"
  - "incompatible"
  - "overheating"
  - "throttling"
  - "pairing failed"
  - "won't pair"
  - "offline"
  - "unavailable"
  - "dropped"
  - "disconnected"
  - "latency"
  - "delay"

# ============================================================
# Pain Point Clusters
# ============================================================
pain_clusters:
  zigbee_pairing:
    label: "Zigbee Pairing / Device Issues"
    keywords:
      - "zigbee"
      - "pairing"
      - "pair"
      - "coordinator"
      - "router"
      - "mesh"
      - "z2m"
      - "zigbee2mqtt"

  matter_thread:
    label: "Matter / Thread Issues"
    keywords:
      - "matter"
      - "thread"
      - "commissioning"
      - "fabric"
      - "border router"
      - "matter bridge"

  ha_integration:
    label: "Home Assistant Integration Issues"
    keywords:
      - "home assistant"
      - "hass"
      - "integration"
      - "addon"
      - "lovelace"
      - "automation"
      - "yaml"
      - "config"

  network_mqtt:
    label: "Network / MQTT / Connectivity Issues"
    keywords:
      - "mqtt"
      - "broker"
      - "wifi"
      - "ethernet"
      - "connection"
      - "offline"
      - "disconnect"
      - "ping"

  lora_lorawan:
    label: "LoRa / LoRaWAN Issues"
    keywords:
      - "lora"
      - "lorawan"
      - "gateway"
      - "ttn"
      - "chirpstack"
      - "frequency"
      - "sf"
      - "spreading factor"

  edge_boot:
    label: "Edge Controller / SBC Boot Issues"
    keywords:
      - "boot"
      - "startup"
      - "won't start"
      - "not booting"
      - "sd card"
      - "emmc"
      - "bootloader"

  power_hardware:
    label: "Power / Hardware Issues"
    keywords:
      - "power"
      - "voltage"
      - "overheating"
      - "temperature"
      - "throttle"
      - "psu"
      - "watt"

  software_driver:
    label: "Software / Driver / OS Issues"
    keywords:
      - "driver"
      - "kernel"
      - "os"
      - "ubuntu"
      - "debian"
      - "armbian"
      - "install"
      - "package"
      - "dependency"

  cloud_local:
    label: "Cloud vs Local Control Issues"
    keywords:
      - "cloud"
      - "local"
      - "offline"
      - "tuya"
      - "subscription"
      - "privacy"
      - "data"
      - "server"

